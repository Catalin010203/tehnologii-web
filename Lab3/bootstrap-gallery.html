
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab 3 - Bootstrap Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .gallery-card {
            height: 100%;
            padding: 24px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="container py-4">
        <h1 class="mb-4">Bootstrap Card Gallery</h1>

        <div class="row g-3">

            <div class="col-12 col-md-6">
                <div class="gallery-card">
                    <h2 class="h4">Card 1</h2>
                    <p>First gallery item.</p>
                    <a href="#card1" class="btn btn-primary">
                        Learn more
                    </a>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="gallery-card">
                    <h2 class="h4">Card 2</h2>
                    <p>Second gallery item.</p>
                    <a href="#card2" class="btn btn-primary">
                        Learn more
                    </a>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="gallery-card">
                    <h2 class="h4">Card 3</h2>
                    <p>Third gallery item.</p>
                    <a href="#card3" class="btn btn-primary">
                        Learn more
                    </a>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="gallery-card">
                    <h2 class="h4">Card 4</h2>
                    <p>Fourth gallery item.</p>
                    <a href="#card4" class="btn btn-primary">
                        Learn more
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
